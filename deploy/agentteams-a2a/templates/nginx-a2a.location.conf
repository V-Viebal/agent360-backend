# Insert BEFORE the generic `location /api/` in agent360-frontend nginx.
# Do NOT inject a token here: the control plane authorizes each caller itself.
#   - public, payload-free GETs (health, metrics, directory, bindings) need no token;
#   - ledger reads and every write need `Authorization: Bearer <A2A_SERVICE_TOKEN|A2A_OPERATOR_TOKEN>`
#     (agents/MCP use the service token; humans unlock the UI with the operator token);
#   - /a2a/agentteams/events is HMAC-verified (A2A_CALLBACK_SECRET).
location ~ ^/api/(a2a/|agents/[^/]+/external-subagents|agents/[^/]+/a2a/) {
    rewrite ^/api/(.*)$ /api/v1/$1 break;
    proxy_pass http://agent360-a2a:8095;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
}
