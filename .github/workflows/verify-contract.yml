name: Agent360 Contract Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Agent360 contracts
        run: |
          python3 -m json.tool agent360-contract.json >/dev/null
          for f in contracts/*.json; do
            echo "Checking $f..."
            python3 -m json.tool "$f" >/dev/null
          done
          test ! -e src/qwenpaw
          test ! -e console
          test ! -e plugins
          test ! -e website
          bash -n scripts/verify-separation.sh
          echo "Agent360 overlay contract: PASS"
