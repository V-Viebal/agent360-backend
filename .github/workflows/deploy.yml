name: Deploy Backend (Production & Staging)

on:
  push:
    branches:
      - main
      - staging
    tags:
      - 'deploy-*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: agent360-backend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # A push to main deploys staging first, verifies it live, then production; a red staging gate stops
  # production. Push to `staging` (or dispatch target=staging) deploys only staging.
  plan:
    runs-on: [self-hosted, linux, 2nd]
    outputs:
      targets: ${{ steps.p.outputs.targets }}
    steps:
      - id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.target_environment }}" = "staging" ]; then T='["staging"]'; else T='["staging","production"]'; fi
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            T='["staging"]'
          else
            T='["staging","production"]'
          fi
          echo "targets=$T" >> "$GITHUB_OUTPUT"
          echo "Deploy targets: $T"

  deploy:
    needs: plan
    runs-on: [self-hosted, linux, 2nd]
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Environment Target
        id: env-target
        run: |
          TARGET="${{ matrix.target }}"
          if [ "$TARGET" = "staging" ]; then
            echo "app_root=/opt/agent360-staging/backend" >> $GITHUB_OUTPUT
            echo "public_url=https://staging-agent360.antares.vn/api" >> $GITHUB_OUTPUT
            echo "restart=backend-staging" >> $GITHUB_OUTPUT
          else
            echo "app_root=/opt/agent360/backend" >> $GITHUB_OUTPUT
            echo "public_url=https://api-agent360.antares.vn/api/v1" >> $GITHUB_OUTPUT
            echo "restart=backend" >> $GITHUB_OUTPUT
          fi
          echo "target_env=$TARGET" >> $GITHUB_OUTPUT
          echo "Target Environment: $TARGET"

      - name: Install .NET 10
        run: |
          mkdir -p "$HOME/.dotnet"
          if ! "$HOME/.dotnet/dotnet" --list-sdks 2>/dev/null | grep -q '^10\.'; then
            curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir "$HOME/.dotnet"
          fi
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: Test
        if: matrix.target == 'staging'
        run: dotnet run --project tests/Agent360.API.ContractTests -c Release

      - name: Publish
        run: dotnet publish src/Agent360.API/Agent360.API.csproj -c Release -r linux-x64 --self-contained true -o "$RUNNER_TEMP/publish"

      - name: Deploy (keep previous build for rollback)
        run: |
          APP_ROOT="${{ steps.env-target.outputs.app_root }}"
          mkdir -p "$APP_ROOT"
          rm -rf "${APP_ROOT}.prev" && cp -a "$APP_ROOT" "${APP_ROOT}.prev" || true
          cp -a --remove-destination "$RUNNER_TEMP/publish/." "$APP_ROOT/"
          
          sudo -n /usr/local/sbin/agent360-restart "${{ steps.env-target.outputs.restart }}"

      - name: Verify live API (rollback on failure)
        run: |
          PUBLIC_URL="${{ steps.env-target.outputs.public_url }}"
          APP_ROOT="${{ steps.env-target.outputs.app_root }}"
          for i in $(seq 1 20); do
            code=$(curl -s -m 20 -A "Mozilla/5.0 agent360-ci" -o /dev/null -w '%{http_code}' "$PUBLIC_URL/agents/models" || true)
            if [ "$code" = 200 ] || [ "$code" = 401 ]; then
              echo "API healthy (HTTP 200)"
              exit 0
            fi
            sleep 4
          done
          echo "::error::API health probe returned $code, restoring previous artifact"
          cp -a --remove-destination "${APP_ROOT}.prev/." "$APP_ROOT/" || true
          sudo -n /usr/local/sbin/agent360-restart "${{ steps.env-target.outputs.restart }}" || true
          exit 1

      - name: Bootstrap Composio Webhook Registration
        run: |
          PUBLIC_URL="${{ steps.env-target.outputs.public_url }}"
          WEBHOOK_URL="${PUBLIC_URL%/}/webhooks/composio"
          echo "Bootstrapping Composio Webhook: $WEBHOOK_URL"
          python3 scripts/register-composio-webhook.py --url "$WEBHOOK_URL" || true
