name: Deploy Backend

# Single source of truth for api: build + test on the 2nd runner, publish a self-contained
# linux-x64 build into the mounted /opt/agent360/backend atomically, restart, verify live.
on:
  # Deploy only by explicit dispatch or a `deploy-*` tag. Auto-deploy on push stays disabled while
  # work-in-progress lives only in local working trees (a push-triggered deploy of main would regress prod).
  push:
    tags: ['deploy-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent360-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, 2nd]
    env:
      APP_ROOT: /opt/agent360/backend
      PUBLIC_URL: https://agent360.antares.vn
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10
        run: |
          mkdir -p "$HOME/.dotnet"
          if ! "$HOME/.dotnet/dotnet" --list-sdks 2>/dev/null | grep -q '^10\.'; then
            curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir "$HOME/.dotnet"
          fi
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: Test
        run: dotnet test tests/Agent360.API.ContractTests -c Release

      - name: Publish
        run: dotnet publish src/Agent360.API/Agent360.API.csproj -c Release -r linux-x64 --self-contained true -o "$RUNNER_TEMP/publish"

      - name: Deploy (keep previous build for rollback)
        run: |
          rm -rf "${APP_ROOT}.prev" && cp -a "$APP_ROOT" "${APP_ROOT}.prev"
          # The running apphost is busy: unlink-then-copy (--remove-destination) keeps the old inode
          # alive for the current process and installs the new file for the restart.
          cp -a --remove-destination "$RUNNER_TEMP/publish/." "$APP_ROOT/"
          sudo -n /usr/local/sbin/agent360-restart backend

      - name: Verify live API (rollback on failure)
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/api/agents" || true)
            [ "$code" = 200 ] && { echo "api ok"; exit 0; }
            sleep 5
          done
          echo "api not healthy ($code), rolling back" >&2
          cp -a --remove-destination "${APP_ROOT}.prev/." "$APP_ROOT/"
          sudo -n /usr/local/sbin/agent360-restart backend
          exit 1

