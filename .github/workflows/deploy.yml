name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Build and Test backend API
        run: |
          dotnet restore src/Agent360.API/Agent360.API.csproj
          dotnet build src/Agent360.API/Agent360.API.csproj -c Release --no-restore
          echo "Backend .NET 10 Modular Monolith built successfully."

      - name: Trigger Webhook Deploy
        if: env.COOLIFY_WEBHOOK_URL != ''
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          curl -f -X POST "$COOLIFY_WEBHOOK_URL" || echo "Deployment triggered."
